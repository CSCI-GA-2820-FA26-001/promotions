<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotions Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>Promotions Admin</h1>
            <p>Manage and search promotions.</p>
        </header>

        <section class="card">
            <h2>Search Promotions</h2>

            <div class="search-form">
                <label for="query-attribute">Attribute</label>
                <select id="query-attribute">
                    <option value="id">ID</option>
                    <option value="promotion_type">Promotion Type</option>
                    <option value="value">Value</option>
                    <option value="product_id">Product ID</option>
                    <option value="start_date">Start Date</option>
                    <option value="end_date">End Date</option>
                    <option value="active">Active</option>
                </select>

                <label for="query-value">Search Value</label>
                <input id="query-value" type="text" placeholder="Enter search value">

                <div class="button-row">
                    <button id="search-btn" type="button">Search</button>
                    <button id="clear-btn" type="button">Clear</button>
                </div>
            </div>

            <p id="flash-message" role="status"></p>
        </section>

        <section class="card">
            <h2>Promotions</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Value</th>
                            <th>Product ID</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Active</th>
                        </tr>
                    </thead>
                    <tbody id="search-results"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>

</html>
