
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Promotions Admin</title>

    <!-- Shared UI styling from Query Promotions branch -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Existing List Promotions functionality -->
    <script defer
            src="{{ url_for('static', filename='promotions.js') }}"></script>
</head>

<body>
    <main class="container">

        <!-- Page Header -->
        <header class="page-header">
            <h1>Promotions Admin</h1>
            <p>Manage and view promotions.</p>
        </header>

        <!-- Promotions List Card -->
        <section class="card">
            <h2>Promotions</h2>

            <!-- List loading, empty, and error messages -->
            <p id="list-message"
               data-testid="list-message"
               role="status"
               aria-live="polite">
                Loading promotions...
            </p>

            <!-- Promotions Table -->
            <div class="table-wrapper">
                <table data-testid="promotions-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Value</th>
                            <th>Product ID</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Active</th>
                        </tr>
                    </thead>

                    <tbody id="promotion-list"></tbody>
                </table>
            </div>
        </section>

    </main>
</body>

</html>
