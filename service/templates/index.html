<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotions Admin</title>
    <script defer src="{{ url_for('static', filename='promotions.js') }}"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            color: #222;
        }
        h1 { margin-bottom: 8px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background: #f4f4f4; }
        #list-message { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Promotions Admin</h1>
    <p>View and manage promotions.</p>

    <p id="list-message"
       data-testid="list-message"
       role="status">
        Loading promotions...
    </p>

    <table data-testid="promotions-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Type</th>
                <th>Value</th>
                <th>Product ID</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Active</th>
            </tr>
        </thead>
        <tbody id="promotion-list"></tbody>
    </table>
</body>
</html>
